atórias por Lei.","r":true,"b":"Documentam manutenções, ocorrências e simulacros."},{"m":"VIG 06","o":"Criada","p":"Os registos técnicos e relatórios são parte central do serviço de vigilância profissional.","r":true,"b":"Praticamente todos os incidentes relevantes devem ser documentados rigorosamente."},{"m":"VIG 06","o":"Criada","p":"Os simulacros servem para testar medidas de autoproteção e treinar os ocupantes.","r":true,"b":"O manual define esses objetivos para os simulacros."},{"m":"VIG 06","o":"Criada","p":"Registar a sequência cronológica dos acontecimentos ajuda a compreender o incidente.","r":true,"b":"A ordem temporal é essencial para reconstruir a ocorrência."},{"m":"VIG 06","o":"Criada","p":"Relatórios e registos devem ser consistentes com o que realmente aconteceu.","r":true,"b":"A exatidão factual é um princípio básico da elaboração de relatórios."},{"m":"VIG 06","o":"Criada","p":"Um relatório de ocorrência deve ser redigido com uma linguagem subjetiva, focando-se naquilo que o vigilante sentiu durante o incidente.","r":false,"b":"Manual VIG06, pág. 52. Deve ser objetivo, factual e responder a: Quem, O quê, Onde, Quando e Como."},{"m":"VIG 06","o":"Criada","p":"Um relatório de ocorrência deve ser vago para proteger a privacidade das pessoas envolvidas.","r":false,"b":"Deve ser preciso, completo, com nomes, horas e detalhes. Privacidade não justifica falta de clareza."},{"m":"VIG 06","o":"Criada","p":"Um relatório pode ser redigido muito tempo depois, mesmo que o vigilante já não se recorde bem dos factos.","r":false,"b":"A redação deve ser feita o mais cedo possível para preservar exatidão e detalhe."},{"m":"VIG 06","o":"Criada","p":"Um relatório técnico pode ser útil para memória futura, auditoria interna ou apoio às autoridades.","r":true,"b":"A função documental dos relatórios justifica o rigor exigido."},{"m":"VIG 07","o":"Criada","p":"A defesa pessoal deve respeitar os princípios da legalidade, necessidade e proporcionalidade.","r":true,"b":"A defesa pessoal na segurança privada não é artes marciais livres; é uma ferramenta jurídica de proteção. Para ser legítima, deve ser: Legal: apenas para repelir uma agressão atual e ilícita; Necessária: usada apenas quando o diálogo ou a presença física não resolvem; Proporcional: a força aplicada deve ser o mínimo possível para parar o ataque, sem causar danos excessivos ou desnecessários."},{"m":"VIG 07","o":"Criada","p":"A defesa pessoal no contexto de vigilância é apresentada como protecção e controlo proporcional.","r":true,"b":"Deve estar subordinada à legalidade, necessidade e autoprotecção, nunca agressão pura."},{"m":"VIG 07","o":"Criada","p":"A defesa pessoal no contexto do vigilante tem como finalidade principal castigar o agressor.","r":false,"b":"O objetivo é proteção e controlo da situação, não punição."},{"m":"VIG 07","o":"Criada","p":"A defesa pessoal pode ser compatível com controlo da situação sem recurso a agressão gratuita.","r":true,"b":"Essa é precisamente a distinção feita pelo manual entre proteção e agressão."},{"m":"VIG 07","o":"Criada","p":"A defesa pessoal pode ser usada para resolver discussões verbais sem risco físico.","r":false,"b":"Sem agressão ou ameaça adequada, o recurso físico é indevido."},{"m":"VIG 07","o":"Criada","p":"A defesa pessoal é apresentada no manual como uma técnica de reação e não como uma forma de agressão.","r":true,"b":"A pergunta testa a ideia central do módulo: a defesa pessoal surge para proteger e controlar a situação, não para agredir gratuitamente."},{"m":"VIG 07","o":"Criada","p":"A eficácia em defesa pessoal depende apenas da força física.","r":false,"b":"O módulo associa eficácia a técnica, treino, prevenção e proporcionalidade."},{"m":"VIG 07","o":"Criada","p":"A prevenção é preferível ao confronto físico sempre que possível.","r":true,"b":"O manual valoriza a prevenção e a leitura antecipada do risco antes da reação física."},{"m":"VIG 07","o":"Criada","p":"A prevenção, a atenção e a postura profissional podem evitar que o agressor chegue a vias de facto.","r":true,"b":"A pergunta avalia a vertente preventiva da defesa pessoal no contexto da segurança privada."},{"m":"VIG 07","o":"Criada","p":"A reação do vigilante deve ser proporcional ao nível da ameaça.","r":true,"b":"A força física no serviço de segurança privada é sempre uma medida de exceção. O objetivo é sempre cessar a agressão e nunca \"castigar\" ou \"retaliar\" contra o agressor. Se passares do limite necessário, podes responder pelo crime de excesso de legítima defesa."},{"m":"VIG 07","o":"Criada","p":"A reação física só deve surgir quando outras formas adequadas de prevenção falharam ou não são possíveis.","r":true,"b":"O manual define a defesa pessoal como reação enquadrada e não como primeira escolha."},{"m":"VIG 07","o":"Criada","p":"Defesa pessoal e autoproteção são conceitos totalmente desligados no serviço de vigilância.","r":false,"b":"No manual, a defesa pessoal está diretamente ligada à autoproteção."},{"m":"VIG 07","o":"Criada","p":"O treino consistente melhora a capacidade de resposta em situações de perigo.","r":true,"b":"O manual destaca a consistência do treino como essencial."},{"m":"VIG 07","o":"Criada","p":"O vigilante deve manter atenção ao ambiente para antecipar sinais de perigo.","r":true,"b":"A prevenção depende de leitura do contexto e antecipação."},{"m":"VIG 07","o":"Criada","p":"O vigilante deve privilegiar a autoproteção e a segurança global da situação.","r":true,"b":"A defesa pessoal é enquadrada como proteção e controlo do risco."},{"m":"VIG 07","o":"Criada","p":"O vigilante deve recorrer à força física mesmo quando a situação pode ser resolvida por observação, posicionamento e comunicação.","r":false,"b":"A pergunta testa o princípio de que a intervenção física não deve ser a primeira escolha quando existem meios menos gravosos e adequados."}];
var MODULES = [{"id":"ALM 01","n":36},{"id":"ALM 02","n":20},{"id":"BAS 01","n":15},{"id":"BAS 02","n":21},{"id":"BAS 03","n":10},{"id":"BAS 04","n":20},{"id":"BAS 05","n":12},{"id":"BAS 06","n":22},{"id":"VIG 01","n":28},{"id":"VIG 02","n":27},{"id":"VIG 03","n":30},{"id":"VIG 04","n":16},{"id":"VIG 05","n":35},{"id":"VIG 06","n":31},{"id":"VIG 07","n":16}];
var MODNAMES = {"ALM 01":"Sistemas de alarme e segurança eletrónica","ALM 02":"Videovigilância","BAS 01":"Direitos fundamentais e Constituição","BAS 02":"Direito penal e processo","BAS 03":"Regime jurídico da segurança privada","BAS 04":"Ética e deontologia","BAS 05":"Comunicação e relatórios","BAS 06":"Segurança e higiene no trabalho","VIG 01":"Segurança física e análise de riscos","VIG 02":"Técnicas de vigilância","VIG 03":"Emergência e proteção de pessoas","VIG 04":"Revistas pessoais","VIG 05":"Gestão de conflitos","VIG 06":"Registos de segurança e SCIE","VIG 07":"Defesa pessoal"};
var TOTAL_VF = 339;

var app = document.getElementById("app");
var state = null;

function shuffle(a) {
  var arr = a.slice();
  for (var i = arr.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = arr[i]; arr[i] = arr[j]; arr[j] = t; }
  return arr;
}

function home() {
  state = null;
  var h = '<h1>Quiz Vigilante</h1><p class="sub">Segurança Privada · ' + TOTAL_VF + ' perguntas V/F · 15 módulos</p>';
  h += '<button class="btn primary" onclick="startGen()">Teste geral — 25 perguntas aleatórias</button>';
  h += '<button class="btn secondary" onclick="startAll()">Todos os módulos (' + TOTAL_VF + ' perguntas)</button>';
  h += '<div class="section-title">Treinar por módulo</div>';
  MODULES.forEach(function(m) {
    if (m.n === 0) return;
    h += '<button class="btn" onclick="startMod(\'' + m.id + '\')">' +
      '<span class="count">' + m.n + '</span><span class="mtitle">' + m.id + '</span>' +
      '<span class="badge">' + (m.id.indexOf('ALM') === 0 ? 'Alarmes' : m.id.indexOf('BAS') === 0 ? 'Básico' : 'Vigilância') + '</span>' +
      '<div class="mdesc">' + (MODNAMES[m.id] || '') + '</div></button>';
  });
  app.innerHTML = h;
}

function begin(title, qs) {
  state = { title: title, qs: qs, i: 0, ok: 0, answered: false };
  renderQ();
}

function startMod(m) { begin("Módulo " + m, shuffle(QUESTIONS.filter(function(q){ return q.m === m; }))); }
function startAll() { begin("Todos os módulos", shuffle(QUESTIONS)); }
function startGen() { begin("Teste geral", shuffle(QUESTIONS).slice(0, 25)); }

function renderQ() {
  var s = state, q = s.qs[s.i], pct = Math.round((s.i / s.qs.length) * 100);
  var h = '<button class="backlink" onclick="confirmHome()">← Sair do teste</button>';
  h += '<div class="prog"><div style="width:' + pct + '%"></div></div>';
  h += '<div class="card">';
  h += '<div class="qmeta"><span>' + s.title + '</span><span>Pergunta ' + (s.i + 1) + ' de ' + s.qs.length + ' · ✓ ' + s.ok + '</span></div>';
  h += '<p class="qtext">' + escapeHtml(q.p) + '</p>';
  h += '<div class="opts">' +
    '<button class="opt" id="optT" onclick="answer(true)">Verdadeiro</button>' +
    '<button class="opt" id="optF" onclick="answer(false)">Falso</button></div>';
  h += '<div id="fb"></div>';
  h += '<button class="next" id="next" disabled onclick="nextQ()">Seguinte →</button>';
  h += '</div>';
  app.innerHTML = h;
}

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function answer(v) {
  if (state.answered) return;
  state.answered = true;
  var q = state.qs[state.i];
  var correct = v === q.r;
  if (correct) state.ok++;
  var t = document.getElementById("optT"), f = document.getElementById("optF");
  (q.r ? t : f).classList.add("correct");
  if (!correct) (v ? t : f).classList.add("wrong");
  var fb = document.getElementById("fb");
  fb.className = "fb " + (correct ? "ok" : "no");
  var msg = "<b>" + (correct ? "✅ Correto!" : "❌ Errado — resposta: " + (q.r ? "Verdadeiro" : "Falso")) + "</b>";
  if (q.b) msg += escapeHtml(q.b);
  else if (!correct) msg += "Afirmação " + (q.r ? "verdadeira." : "falsa.");
  fb.innerHTML = msg;
  var nx = document.getElementById("next");
  nx.disabled = false;
  nx.textContent = (state.i === state.qs.length - 1) ? "Ver resultado →" : "Seguinte →";
}

function nextQ() {
  state.answered = false;
  state.i++;
  if (state.i >= state.qs.length) results();
  else renderQ();
}

function results() {
  var s = state, n = s.qs.length, wrong = n - s.ok, pct = Math.round((s.ok / n) * 100);
  var msg = pct >= 80 ? "Excelente! Preparado para o exame." : pct >= 60 ? "Bom, mas convém rever alguma matéria." : "Precisas de estudar mais este módulo.";
  var h = '<div class="card" style="text-align:center">';
  h += '<p class="sub" style="margin-bottom:2px">' + s.title + ' · concluído</p>';
  h += '<div class="score">' + s.ok + '/' + n + '</div>';
  h += '<div class="stats"><div class="stat s-ok"><div class="n">' + s.ok + '</div>acertos</div>' +
    '<div class="stat s-no"><div class="n">' + wrong + '</div>erros</div>' +
    '<div class="stat s-pct"><div class="n">' + pct + '%</div>precisão</div></div>';
  h += '<p style="font-weight:600">' + msg + '</p>';
  h += '<button class="btn primary" style="text-align:center" onclick="retry()">Repetir teste</button>';
  h += '<button class="btn" style="text-align:center" onclick="home()">← Voltar ao início</button>';
  h += '</div>';
  app.innerHTML = h;
}

function retry() {
  var s = state;
  begin(s.title, shuffle(s.qs));
}

function confirmHome() {
  if (state && state.i > 0 && !confirm("Sair do teste? O progresso será perdido.")) return;
  home();
}

home();
</script>
</body>
</html>
