<title>Quiz Vigilante — Segurança Privada</title>
<style>
  :root { font-family: system-ui, -apple-system, sans-serif; color: #1e293b; background: #f1f5f9; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 8px 0 2px; }
  .sub { color: #64748b; font-size: .9rem; margin: 0 0 18px; }
  .card { background: #fff; border-radius: 14px; padding: 20px; box-shadow: 0 1px 4px rgba(15,23,42,.08); margin-bottom: 14px; }
  .btn { display: block; width: 100%; text-align: left; background: #fff; border: 1.5px solid #e2e8f0; border-radius: 12px;
    padding: 13px 16px; margin-bottom: 10px; cursor: pointer; font-size: .95rem; transition: all .15s; }
  .btn:hover { border-color: #3b82f6; background: #f8fafc; }
  .btn .mtitle { font-weight: 600; }
  .btn .mdesc { color: #64748b; font-size: .8rem; margin-top: 2px; }
  .btn .count { float: right; background: #e0e7ff; color: #3730a3; font-size: .75rem; font-weight: 600;
    padding: 3px 9px; border-radius: 99px; margin-left: 8px; }
  .btn.primary { background: #1d4ed8; color: #fff; border-color: #1d4ed8; text-align: center; font-weight: 700; font-size: 1rem; }
  .btn.primary:hover { background: #1e40af; }
  .btn.secondary { background: #0f172a; color: #fff; border-color: #0f172a; text-align: center; font-weight: 700; }
  .prog { height: 7px; background: #e2e8f0; border-radius: 99px; overflow: hidden; margin-bottom: 16px; }
  .prog > div { height: 100%; background: #1d4ed8; border-radius: 99px; transition: width .25s; }
  .qmeta { color: #64748b; font-size: .8rem; margin-bottom: 10px; display: flex; justify-content: space-between; }
  .qtext { font-size: 1.08rem; font-weight: 600; line-height: 1.45; margin: 0 0 18px; }
  .opts { display: flex; gap: 10px; }
  .opt { flex: 1; padding: 14px; border-radius: 12px; border: 2px solid #e2e8f0; background: #fff;
    font-size: 1rem; font-weight: 700; cursor: pointer; transition: all .15s; color: #1e293b; }
  .opt:hover:not(:disabled) { border-color: #1d4ed8; }
  .opt:disabled { cursor: default; opacity: .85; }
  .opt.correct { background: #dcfce7; border-color: #16a34a; color: #14532d; }
  .opt.wrong { background: #fee2e2; border-color: #dc2626; color: #7f1d1d; }
  .fb { border-radius: 12px; padding: 13px 15px; margin-top: 14px; font-size: .92rem; line-height: 1.45; }
  .fb.ok { background: #f0fdf4; border: 1px solid #bbf7d0; color: #14532d; }
  .fb.no { background: #fef2f2; border: 1px solid #fecaca; color: #7f1d1d; }
  .fb b { display: block; margin-bottom: 4px; font-size: .95rem; }
  .next { display: block; width: 100%; margin-top: 14px; padding: 13px; border-radius: 12px; border: none;
    background: #1d4ed8; color: #fff; font-weight: 700; font-size: 1rem; cursor: pointer; }
  .next:disabled { background: #94a3b8; cursor: not-allowed; }
  .score { font-size: 3rem; font-weight: 800; margin: 6px 0; }
  .stats { display: flex; gap: 10px; margin: 14px 0; }
  .stat { flex: 1; text-align: center; padding: 12px; border-radius: 12px; font-size: .85rem; }
  .stat .n { font-size: 1.5rem; font-weight: 800; }
  .s-ok { background: #f0fdf4; color: #14532d; } .s-no { background: #fef2f2; color: #7f1d1d; } .s-pct { background: #eff6ff; color: #1e3a8a; }
  .backlink { background: none; border: none; color: #1d4ed8; cursor: pointer; font-size: .88rem; padding: 0; margin-bottom: 10px; font-weight: 600; }
  .section-title { font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; color: #64748b; font-weight: 700; margin: 18px 0 8px; }
  .badge { display: inline-block; background: #eef2ff; color: #4338ca; border-radius: 99px; padding: 2px 9px; font-size: .7rem; font-weight: 700; margin-left: 6px; vertical-align: middle; }
</style>

<script>
var QUESTIONS = [{"m":"ALM 01","o":"Criada","p":"A auditoria num sistema de acessos serve apenas para abrir portas remotamente.","r":false,"b":"A auditoria serve para consultar registos e rastrear eventos, como saber quem entrou, por onde entrou e a que horas."},{"m":"ALM 01","o":"Criada","p":"A autorização define aquilo que o utilizador pode fazer e em que horários pode aceder.","r":true,"b":"A pergunta pretende confirmar que compreendes o conceito de autorização: ela define permissões, áreas acessíveis e horários válidos."},{"m":"ALM 01","o":"Criada","p":"A autorização define aquilo que um utilizador pode fazer no sistema e quais os acessos permitidos.","r":true,"b":"O manual descreve autorização nesses termos."},{"m":"ALM 01","o":"Oficial","p":"A segurança eletrónica divide-se em Security (proteção contra atos ilícitos) e Safety (proteção contra acidentes/incêndios).","r":true,"b":"A pergunta testa a distinção base da segurança eletrónica: Security liga-se à intrusão, controlo de acessos e videovigilância; Safety liga-se a incêndio e deteção de gás."},{"m":"ALM 01","o":"Oficial","p":"A verificação de alarmes pode ser feita através de vídeo, áudio ou verificação sequencial.","r":true,"b":"São os métodos legais para confirmar se um alarme é real antes de chamar a polícia."},{"m":"ALM 01","o":"Criada","p":"Em caso de alarme de intrusão confirmado, o vigilante deve primeiro desligar a sirene para não incomodar a vizinhança antes de verificar o local.","r":false,"b":"Manual ALM01, Procedimentos. A prioridade é a verificação e segurança; a sirene é um meio de dissuasão."},{"m":"ALM 01","o":"Criada","p":"Na segurança eletrónica, Security abrange intrusão, controlo de acessos e videovigilância.","r":true,"b":"O manual ALM01 distingue Security de Safety."},{"m":"ALM 01","o":"Criada","p":"Na verificação sequencial, um alarme é válido se houver dois sinais de detetores diferentes em menos de 30 minutos.","r":true,"b":"Regra técnica de confirmação de alarmes. Reduz falsos disparos."},{"m":"ALM 01","o":"Criada","p":"Num processo de controlo de acessos, os três passos fundamentais são identificação, autorização e auditoria.","r":true,"b":"O manual enumera esses três passos."},{"m":"ALM 01","o":"Criada","p":"Num sistema de controlo de acessos, a identificação é o momento em que o utilizador apresenta a sua credencial ao sistema.","r":true,"b":"A pergunta testa a fase de identificação: o utilizador apresenta um cartão, código, biometria ou outra credencial ao sistema."},{"m":"ALM 01","o":"Oficial","p":"O \"Botão de Pânico\" deve ser instalado num local de fácil acesso mas discreto.","r":true,"b":"Deve permitir o acionamento rápido sem que o intruso perceba facilmente."},{"m":"ALM 01","o":"Criada","p":"O SADI (Sistema Automático de Detecção de Incêndio) faz parte do pilar Security.","r":false,"b":"O SADI faz parte do pilar Safety. Safety cobre incêndio e gases."},{"m":"ALM 01","o":"Criada","p":"O anti-passback permite que o utilizador entre repetidamente sem necessidade de registar a saída.","r":false,"b":"O manual diz que o leitor fica inoperacional até ser validada a saída."},{"m":"ALM 01","o":"Oficial","p":"O contacto magnético é um detetor tipicamente utilizado em portas e janelas.","r":true,"b":"Deteta a abertura (quebra do campo magnético) da entrada."},{"m":"ALM 01","o":"Criada","p":"O detetor de quebra de vidro reage à frequência sonora específica do vidro a partir-se.","r":true,"b":"É um detetor acústico focado no som do impacto no vidro."},{"m":"ALM 01","o":"Criada","p":"O estado de vigília do sistema de intrusão é usado quando se pretende proteger uma ou mais zonas.","r":true,"b":"O manual refere isso no funcionamento do alarme de intrusão."},{"m":"ALM 01","o":"Oficial","p":"O sistema CCTV (Videovigilância) é considerado um meio de proteção ativa no pilar da Safety.","r":false,"b":"Manual ALM01, pág. 3. CCTV insere-se no pilar da Security (atos ilícitos)."},{"m":"ALM 01","o":"Criada","p":"O sistema SADI serve especificamente para detetar fugas de gás combustível.","r":false,"b":"SADI é para Incêndios (I). Para gases o sistema chama-se SADG (G)."},{"m":"ALM 01","o":"Criada","p":"O sistema responsável pela deteção automática de gases (como CO ou gás natural) chama-se SADG.","r":true,"b":"SADG significa Sistema Automático de Deteção de Gás. A pergunta verifica se distingues os principais sistemas automáticos."},{"m":"ALM 01","o":"Criada","p":"O teclado de um sistema de intrusão deve ser instalado num local visível do lado de fora da instalação.","r":false,"b":"O teclado deve estar protegido dentro da instalação. Se estiver visível de fora, o intruso pode estudar o código ou o estado do alarme."},{"m":"ALM 01","o":"Criada","p":"Os detetores de fumo do tipo ótico funcionam através da dispersão da luz provocada pelas partículas de fumo (Efeito Tyndall).","r":true,"b":"Manual ALM01, pág. 78. É o método de deteção mais comum em edifícios administrativos."},{"m":"ALM 01","o":"Criada","p":"Os detetores de infravermelhos passivos (PIR) emitem luz para detetar o intruso.","r":false,"b":"São passivos porque apenas detetam radiação térmica emitida pelos corpos."},{"m":"ALM 01","o":"Criada","p":"Os detetores termovelocimétricos ativam o alarme quando detetam a presença de fumo no ar.","r":false,"b":"Os detetores termovelocimétricos reagem à subida da temperatura. A deteção de fumo pertence a detetores próprios para esse efeito."},{"m":"ALM 01","o":"Criada","p":"Os dispositivos \"Antipânico\" (barras horizontais) destinam-se a ser usados por pessoas que não conhecem bem as saídas do edifício.","r":true,"b":"Manual ALM01, pág. 156. Permitem uma fuga efetiva com esforço mínimo sob stress."},{"m":"ALM 01","o":"Criada","p":"Os sistemas de Security focam-se no controlo de acessos, SADIR e CCTV.","r":true,"b":"Conforme divisão clara entre Security - protecção contra crime e Safety - protecção técnica."},{"m":"ALM 01","o":"Criada","p":"Os sistemas de segurança eletrónica devem ter uma fonte de alimentação de reserva (baterias).","r":true,"b":"Para garantirem o funcionamento mesmo em caso de corte intencional de energia."},{"m":"ALM 01","o":"Criada","p":"Se não existirem sinais de arrombamento, a entrada no local deve ser feita sem qualquer precaução.","r":false,"b":"O manual manda entrar ainda assim com precaução."},{"m":"ALM 01","o":"Oficial","p":"Um alarme de intrusão só é considerado confirmado para as autoridades se houver ativação de pelo menos dois detetores de zonas diferentes.","r":true,"b":"A pergunta testa o critério de confirmação do alarme, usado para reduzir falsos alarmes e tornar a resposta mais fiável."},{"m":"ALM 01","o":"Criada","p":"Um alarme de sabotagem (tamper) num detetor é suficiente para validar um sinal de alarme.","r":true,"b":"Tentativas de corte de linha ou abertura de sensores validam o alarme."},{"m":"ALM 01","o":"Oficial","p":"Um detetor de dupla tecnologia combina normalmente Infravermelhos (PIR) e Micro-ondas (MW).","r":true,"b":"Serve para evitar falsos alarmes: o alarme só dispara se ambos os sensores detetarem a intrusão ao mesmo tempo."},{"m":"ALM 01","o":"Criada","p":"Um detetor de infravermelhos (PIR) pode \"ver\" através de paredes de betão.","r":false,"b":"Estes sensores detetam calor em linha de vista. Paredes ou móveis grandes bloqueiam o seu alcance."},{"m":"ALM 01","o":"Oficial","p":"Um sistema SADI deteta intrusos através de sensores de movimento infravermelhos.","r":false,"b":"SADI é um Sistema Automático de Deteção de Incêndio. A intrusão é detetada por sistemas de intrusão/alarme (SADIR)."},{"m":"ALM 01","o":"Oficial","p":"Um sistema de alarme \"SADI\" deteta especificamente situações de intrusão.","r":false,"b":"SADI significa Sistema Automático de Deteção de Incêndio."},{"m":"ALM 01","o":"Criada","p":"Um sistema de intrusão (SADI) utiliza apenas detetores volumétricos para proteção do espaço.","r":false,"b":"A pergunta testa a noção de que um sistema de intrusão pode integrar vários tipos de detetores, como volumétricos, perimétricos ou contactos magnéticos."},{"m":"ALM 01","o":"Oficial","p":"Um sistema de intrusão deve ser testado regularmente para garantir a comunicação com a central.","r":true,"b":"Testes periódicos evitam que falhas na linha telefónica ou GSM passem despercebidas."},{"m":"ALM 01","o":"Oficial","p":"Uma \"Central de Receção de Alarmes\" (CRA) tem como função principal a instalação física dos sensores nos edifícios.","r":false,"b":"A função da CRA é a monitorização remota e gestão de sinais de alarme 24h."},{"m":"ALM 02","o":"Criada","p":"A afixação de aviso de videovigilância serve para informar as pessoas de que o local se encontra sob captação de imagem.","r":true,"b":"A pergunta testa uma obrigação de transparência associada ao uso legal de sistemas de videovigilância."},{"m":"ALM 02","o":"Oficial","p":"A utilização de câmaras ocultas (escondidas) é, regra geral, proibida na segurança privada.","r":true,"b":"A lei exige que os locais vigiados estejam devidamente sinalizados com avisos."},{"m":"ALM 02","o":"Criada","p":"A videovigilância permite apoiar a deteção de incidentes, a prevenção e a análise posterior de ocorrências.","r":true,"b":"A pergunta avalia a função operacional do CCTV: observar, registar e apoiar a análise de eventos de segurança."},{"m":"ALM 02","o":"Criada","p":"Após o prazo de conservação, as imagens devem ser destruídas no prazo máximo de 48 horas.","r":true,"b":"Regra de segurança de dados e conformidade com RGPD."},{"m":"ALM 02","o":"Oficial","p":"As câmaras PTZ permitem ao operador controlar o movimento (Pan, Tilt) e o Zoom.","r":true,"b":"São câmaras motorizadas ideais para seguimento de alvos em tempo real."},{"m":"ALM 02","o":"Criada","p":"As câmaras de videovigilância podem ser instaladas dentro de casas de banho para evitar furtos.","r":false,"b":"É proibido colocar câmaras em locais que violem a privacidade estrita (casas de banho, balneários)."},{"m":"ALM 02","o":"Criada","p":"As imagens captadas por CCTV podem ser livremente consultadas por qualquer funcionário da empresa.","r":false,"b":"A consulta das imagens não é livre. O acesso deve ser limitado a quem tenha legitimidade funcional para o efeito."},{"m":"ALM 02","o":"Criada","p":"As imagens de videovigilância devem ser conservadas por um período mínimo de 30 dias desde a captação.","r":true,"b":"Prazo legal padrão de conservação conforme Lei Protecção de Dados."},{"m":"ALM 02","o":"Oficial","p":"As imagens de videovigilância podem ser conservadas por um período máximo de 60 dias.","r":false,"b":"Pela Lei 46/2019, o prazo geral é de 30 dias. O setor bancário é a exceção principal, permitindo até 90 dias."},{"m":"ALM 02","o":"Criada","p":"O Vigilante deve verificar se as câmaras estão limpas e a focar corretamente durante o seu turno.","r":true,"b":"Faz parte da manutenção preventiva garantir que o sistema está a captar imagens úteis."},{"m":"ALM 02","o":"Criada","p":"O acesso às imagens gravadas deve ser restrito e protegido por palavra-passe.","r":true,"b":"Garante a privacidade e a integridade das provas gravadas."},{"m":"ALM 02","o":"Criada","p":"O operador de CCTV deve garantir que o horário registado nas imagens está correto.","r":true,"b":"É essencial para que as imagens sirvam como prova legal numa investigação."},{"m":"ALM 02","o":"Criada","p":"O operador de central pode partilhar imagens de ocorrências nas redes sociais da empresa.","r":false,"b":"Viola gravemente dever de sigilo e protecção de dados pessoais."},{"m":"ALM 02","o":"Oficial","p":"O sistema de videovigilância pode ser usado para controlar o desempenho laboral dos funcionários.","r":false,"b":"Segundo a Proteção de Dados (CNPD), é proibido usar câmaras para \"espiar\" se os funcionários trabalham bem ou mal."},{"m":"ALM 02","o":"Oficial","p":"O vigilante de segurança privada pode apagar gravações de CCTV a pedido direto do cliente.","r":false,"b":"O vigilante deve cumprir a lei. Apagar imagens pode constituir destruição de prova ou violação do dever de guarda."},{"m":"ALM 02","o":"Criada","p":"É obrigatória a afixação de avisos de videovigilância em locais com sistemas de captação de imagem.","r":true,"b":"Por lei, as pessoas devem ser informadas de que estão a ser filmadas, quem é a entidade responsável e onde exercer direitos."},{"m":"ALM 02","o":"Oficial","p":"É obrigatória a existência de um registo de acessos às imagens gravadas (quem viu e quando).","r":true,"b":"Para garantir o sigilo, deve haver um registo (log) de todas as pessoas que acederam ao gravador de imagens."},{"m":"ALM 02","o":"Criada","p":"É obrigatório afixar aviso visível de que o local está sujeito a videovigilância.","r":true,"b":"Requisito legal de transparência e informação ao público."},{"m":"ALM 02","o":"Criada","p":"É permitido colocar câmaras viradas para a via pública para vigiar o trânsito.","r":false,"b":"As câmaras de segurança privada não podem incidir sobre a via pública (salvo exceções raras)."},{"m":"ALM 02","o":"Criada","p":"É permitido gravar som em locais públicos se o sistema de vídeo estiver sinalizado.","r":false,"b":"Gravação de som é proibida sem autorização da Comissão Nacional de Protecção de Dados."},{"m":"BAS 01","o":"Criada","p":"A Convenção Europeia dos Direitos do Homem só se aplica a cidadãos com nacionalidade europeia.","r":false,"b":"Aplica-se a qualquer pessoa sob a jurisdição dos Estados membros, independentemente de nacionalidade."},{"m":"BAS 01","o":"Criada","p":"A Declaração Universal dos Direitos Humanos foi adotada pela Assembleia Geral das Nações Unidas em 1948.","r":true,"b":"Marco histórico após a 2ª Guerra Mundial. Estabelece 30 artigos de direitos humanos universais."},{"m":"BAS 01","o":"Criada","p":"A bandeira nacional é um símbolo da soberania da República Portuguesa.","r":true,"b":"Art. 11º da CRP. A bandeira e o hino são símbolos nacionais."},{"m":"BAS 01","o":"Criada","p":"A liberdade de expressão permite insultar e difamar outras pessoas sem qualquer limite.","r":false,"b":"Tens liberdade de expressão, mas tens de respeitar o direito ao bom nome e à reputação dos outros."},{"m":"BAS 01","o":"Oficial","p":"De acordo com a Constituição da República Portuguesa, a vida humana é violável e existe pena de morte de acordo com a Constituição.","r":false,"b":"Art. 24º da CRP estabelece expressamente que em caso algum há pena de morte."},{"m":"BAS 01","o":"Oficial","p":"De acordo com a Constituição da República Portuguesa, em caso algum haverá pena de morte.","r":true,"b":"Art. 24º da CRP. A vida humana é inviolável em todas as circunstâncias, sem exceção legal ou constitucional."},{"m":"BAS 01","o":"Oficial","p":"De acordo com a Constituição da República, são tarefas fundamentais do Estado promover a igualdade entre homens e mulheres.","r":true,"b":"Art. 9º da CRP. É dever do Estado português garantir a igualdade sem discriminação de género."},{"m":"BAS 01","o":"Criada","p":"De acordo com o manual, a dignidade da pessoa humana é o fundamento da República Portuguesa.","r":true,"b":"Princípio basilar do Estado de Direito Democrático. Base de toda a ordem jurídica portuguesa."},{"m":"BAS 01","o":"Criada","p":"O Estado pode intervir na liberdade de culto apenas em situações de emergência declaradas.","r":false,"b":"A pergunta testa os limites do estado de exceção. A liberdade de religião e de culto integra o núcleo de direitos que não pode ser suspenso, nem mesmo em estado de sítio ou de emergência."},{"m":"BAS 01","o":"Criada","p":"O direito à integridade moral e física é considerado inviolável.","r":true,"b":"Art. 25º da CRP. Ninguém pode ser torturado ou submetido a penas desumanas ou degradantes."},{"m":"BAS 01","o":"Criada","p":"O direito à vida em Portugal admite exceções em caso de crimes muito graves.","r":false,"b":"Em Portugal a vida é inviolável. Não há exceções, nem mesmo para os crimes mais graves."},{"m":"BAS 01","o":"Criada","p":"O domicílio e o sigilo da correspondência são invioláveis, salvo em casos previstos na lei.","r":true,"b":"A Constituição protege a tua casa e as tuas mensagens, mas a polícia pode entrar com mandado judicial em casos de crime."},{"m":"BAS 01","o":"Oficial","p":"Os Direitos, Liberdades e Garantias encontram-se previstos e regulados na Constituição da República Portuguesa.","r":true,"b":"A afirmação é verdadeira porque os direitos, liberdades e garantias encontram consagração expressa na Constituição da República Portuguesa. A pergunta testa o reconhecimento de que estas matérias têm base constitucional direta e não dependem apenas de legislação ordinária."},{"m":"BAS 01","o":"Criada","p":"Os direitos fundamentais podem ser suspensos em qualquer situação de protesto social.","r":false,"b":"Apenas em estado de sítio ou emergência, com regras constitucionais muito estritas."},{"m":"BAS 01","o":"Oficial","p":"Todos têm o direito de resistir a qualquer ordem que ofenda os seus direitos, liberdades e garantias e de repelir pela força qualquer agressão, sempre, mesmo na presença da autoridade pública.","r":false,"b":"Art. 21º da CRP. O direito de resistência existe apenas quando não se pode recorrer à autoridade pública e sem limites legais."},{"m":"BAS 02","o":"Criada","p":"A coação moral irresistível exclui a culpa do agente.","r":true,"b":"O agente atua sem liberdade de decisão devido a ameaça grave ou insuperável."},{"m":"BAS 02","o":"Criada","p":"A legítima defesa permite ao vigilante usar qualquer meio, mesmo que excessivo, para parar uma agressão.","r":false,"b":"A legítima defesa exige proporcionalidade entre o meio utilizado e a gravidade da agressão sofrida."},{"m":"BAS 02","o":"Criada","p":"A legítima defesa permite usar qualquer meio de força, mesmo que seja exagerado.","r":false,"b":"A defesa deve ser proporcional. Se podes parar a agressão com um empurrão, não podes usar uma arma."},{"m":"BAS 02","o":"Oficial","p":"A lei penal aplica-se a factos praticados antes da sua entrada em vigor se for mais favorável ao arguido.","r":true,"b":"É o princípio da aplicação da lei penal mais favorável (retroatividade benigna)."},{"m":"BAS 02","o":"Criada","p":"A omissão de auxílio pode ser considerada um crime punível por lei.","r":true,"b":"Existe dever de agir perante perigo para a vida ou integridade física de outrem."},{"m":"BAS 02","o":"Criada","p":"A tentativa de um crime é punível apenas se a lei o disser expressamente.","r":true,"b":"Regra geral do Código Penal: a tentativa só se pune em crimes com pena superior a 3 anos ou casos específicos."},{"m":"BAS 02","o":"Criada","p":"A tentativa é punível apenas se a lei o indicar expressamente para esse crime.","r":true,"b":"Regra geral do Código Penal. Para certos crimes a tentativa não é punível."},{"m":"BAS 02","o":"Oficial","p":"De acordo com o Código Penal constitui legitima defesa o Fato praticado como meio para contrapor a agressão atual e lícita de interesses juridicamente desprotegidos do agente ou de terceiro.","r":false,"b":"A afirmação é falsa porque a legítima defesa exige uma agressão atual e ilícita, e não lícita. O erro está nessa palavra, que altera totalmente o sentido jurídico da definição prevista no Código Penal."},{"m":"BAS 02","o":"Oficial","p":"De acordo com o Código Penal, entre outros, são crimes contra a propriedade o furto e o furto qualificado.","r":true,"b":"Arts. 203-204 do CP. Classificação de crimes contra a propriedade."},{"m":"BAS 02","o":"Criada","p":"No Direito Penal, a analogia pode ser usada para criar novos crimes.","r":false,"b":"É proibido o uso da analogia para incriminar factos. Princípio da Legalidade."},{"m":"BAS 02","o":"Oficial","p":"O crime de furto é um crime contra o património.","r":true,"b":"O furto protege o direito de propriedade sobre bens móveis."},{"m":"BAS 02","o":"Criada","p":"O crime de injúria consiste em ofender a honra ou consideração de outra pessoa.","r":true,"b":"Diferente da difamação (falar mal a terceiros), a injúria é dirigida diretamente à pessoa."},{"m":"BAS 02","o":"Criada","p":"O crime de injúria é classificado como um crime contra o património.","r":false,"b":"É um crime contra a honra e dignidade da pessoa, não contra a propriedade."},{"m":"BAS 02","o":"Criada","p":"O erro sobre a ilicitude pode excluir a culpa se o vigilante não puder evitar o erro.","r":true,"b":"O erro sobre a ilicitude exclui a culpa se for inevitável; se for evitável ou censurável, o agente é punido, podendo a pena ser especialmente atenuada."},{"m":"BAS 02","o":"Oficial","p":"O homicídio negligente ocorre quando não há intenção de matar, mas houve falta de cuidado.","r":true,"b":"Negligência é a omissão do cuidado devido, sem intenção direta do resultado."},{"m":"BAS 02","o":"Oficial","p":"Quando as disposições penais vigentes no momento da prática do facto punível forem diferentes das estabelecidas em leis posteriores, é sempre aplicado o regime que concretamente se mostrar mais favorável ao agente.","r":true,"b":"Art. 2.º do Código Penal. Aplica-se o regime concretamente mais favorável ao agente."},{"m":"BAS 02","o":"Oficial","p":"Salvo tratado ou convenção internacional em contrário, a lei penal portuguesa é aplicável apenas a arguidos de nacionalidade estrangeira.","r":false,"b":"A lei penal portuguesa é aplicável a cidadãos portugueses e estrangeiros conforme o crime."},{"m":"BAS 02","o":"Criada","p":"Se o vigilante agir com \"excesso de legítima defesa\", ele não pode ser punido.","r":false,"b":"Se houver excesso (usar força a mais), o vigilante pode ser punido, embora a pena possa ser reduzida."},{"m":"BAS 02","o":"Criada","p":"Se um vigilante agir em Legítima Defesa, o seu ato não é considerado crime.","r":true,"b":"A legítima defesa \"exclui a ilicitude\", ou seja, a lei diz que o ato foi justificado para proteção."},{"m":"BAS 02","o":"Oficial","p":"Só pode ser punido criminalmente o facto descrito e declarado passível de pena por lei anterior ao momento da sua prática.","r":true,"b":"Princípio da Legalidade - Nulla poena sine lege. Sem lei prévia não há pena."},{"m":"BAS 02","o":"Oficial","p":"Um cidadão detido em flagrante delito deve ser apresentado a um juiz no prazo máximo de 48 horas.","r":true,"b":"Art. 28º da CRP. É o prazo limite para a primeira audição judicial de detido."},{"m":"BAS 03","o":"Oficial","p":"A Lei de Segurança Privada estabelece o regime do exercício da atividade de segurança privada, da organização de serviços de autoproteção e as medidas a adotar, por entidades públicas ou privadas, com vista a prevenir a prática de crimes.","r":true,"b":"A afirmação é verdadeira porque a Lei da Segurança Privada regula o exercício da atividade, a organização de serviços de autoproteção e medidas de prevenção da criminalidade. A pergunta testa o objeto geral e o alcance do diploma base da segurança privada."},{"m":"BAS 03","o":"Oficial","p":"A atividade de segurança privada tem função complementar à atividade das forças e serviços de segurança pública do Estado.","r":true,"b":"Lei 34/2013. A segurança privada não substitui o Estado, mas complementa."},{"m":"BAS 03","o":"Criada","p":"A exibição do cartão profissional é obrigatória sempre que solicitada pelas autoridades.","r":true,"b":"O segurana deve estar sempre identificado em serviço e apresentar cartão quando requisitado."},{"m":"BAS 03","o":"Oficial","p":"As entidades e o pessoal de segurança privada, no exercício das suas funções, não podem interferir ou intervir em manifestações e reuniões públicas.","r":true,"b":"Esta pergunta testa uma proibição legal da atividade de segurança privada: o vigilante não pode intervir em manifestações, reuniões públicas ou conflitos de natureza política, sindical ou laboral."},{"m":"BAS 03","o":"Criada","p":"Empresas de segurança privada podem exercer funções de protecção de testemunhas.","r":false,"b":"Função exclusiva das forças e serviços de segurança do Estado. Vigilante não tem poderes coercivos."},{"m":"BAS 03","o":"Oficial","p":"Entende-se por monitorização de alarmes todos os atos e procedimentos relacionados com a receção de sinais de alarme, bem como a resposta e reposição de alarmes.","r":true,"b":"Atividade típica de segurança privada autorizada e regulada."},{"m":"BAS 03","o":"Oficial","p":"No exercício da atividade de segurança privada é proibida a fiscalização de títulos de transporte e a elaboração de estudos e planos de segurança.","r":false,"b":"A afirmação é falsa porque junta duas realidades diferentes. A pergunta pretende avaliar se distingues funções vedadas ao vigilante comum de atividades que podem existir no setor quando exercidas por entidades ou profissionais legalmente habilitados."},{"m":"BAS 03","o":"Criada","p":"O regime jurídico permite o uso de cães em serviços de vigilância de bens imóveis.","r":true,"b":"Permitido conforme cumprimento de bem-estar animal, segurança e formação do condutor."},{"m":"BAS 03","o":"Criada","p":"O vigilante pode usar arma de fogo em qualquer posto de serviço por iniciativa própria.","r":false,"b":"O uso de arma depende do tipo de serviço autorizado e aprovação específica da PSP."},{"m":"BAS 03","o":"Criada","p":"É dever do segurana privado impedir a entrada de forças policiais num estabelecimento.","r":false,"b":"Existe dever legal de colaboração e facilitação de acesso às forças de segurança."},{"m":"BAS 04","o":"Criada","p":"A distância de segurança num atendimento deve ser mantida para protecção do vigilante.","r":true,"b":"Técnica de autoprotecção e respeito pelo espaço pessoal do cliente ou visitante."},{"m":"BAS 04","o":"Criada","p":"A postura corporal do segurana deve transmitir autoridade sem agressividade.","r":true,"b":"A imagem profissional começa na comunicação não-verbal. Equilíbrio entre confiança e respeito."},{"m":"BAS 04","o":"Criada","p":"A ética profissional impede que o vigilante utilize os meios da empresa para fins pessoais.","r":true,"b":"O zelo pelos bens da empresa e do cliente é um princípio deontológico."},{"m":"BAS 04","o":"Criada","p":"Em caso de conflito, o vigilante deve tentar a desescalada através do diálogo.","r":true,"b":"A força é sempre o último recurso - princípio da necessidade e subsidiariedade."},{"m":"BAS 04","o":"Criada","p":"Em caso de greve, o vigilante pode abandonar o posto sem aviso prévio.","r":false,"b":"Existem serviços mínimos e procedimentos legais a cumprir, o abandono de posto é falta grave."},{"m":"BAS 04","o":"Oficial","p":"No atendimento presencial é necessário ter em atenção a voz, os gestos, o vocabulário mas não é relevante ter em conta a expressão do rosto.","r":false,"b":"A expressão do rosto é o elemento mais rápido de comunicação não-verbal. Todos os elementos são relevantes."},{"m":"BAS 04","o":"Oficial","p":"No âmbito da atividade profissional, pode o pessoal de segurança privada pode utilizar o equipamento de serviço, fora do mesmo.","r":false,"b":"A afirmação é falsa porque o equipamento de serviço deve ser usado no contexto funcional para que foi atribuído. Fora do serviço, a sua utilização não é permitida como regra, o que protege a disciplina, a imagem profissional e o uso controlado dos meios."},{"m":"BAS 04","o":"Criada","p":"O Vigilante tem o dever de colaborar com as forças de segurança (PSP/GNR).","r":true,"b":"É um dever fundamental da profissão auxiliar as autoridades quando solicitado ou em caso de crime."},{"m":"BAS 04","o":"Criada","p":"O atendimento telefónico deve ser feito de forma rápida e fria para despachar o cliente.","r":false,"b":"Deve ser cortês, profissional, claro e esclarecedor, permitindo tempo para compreensão."},{"m":"BAS 04","o":"Oficial","p":"O cartão profissional deve estar sempre visível durante o exercício da função.","r":true,"b":"É um dever de identificação perante o público e autoridades."},{"m":"BAS 04","o":"Criada","p":"O dever de urbanidade obriga o vigilante a tratar o público com cortesia e respeito.","r":true,"b":"A urbanidade é a base do contacto com o público na segurança privada."},{"m":"BAS 04","o":"Oficial","p":"O profissional de segurança privada deve conhecer totalmente as atribuições da sua função e relacioná-las corretamente com a legislação que define a sua missão, responsabilidades, direitos e deveres.","r":true,"b":"Competência profissional fundamental para vigilante. Conhecimento da lei obrigatório."},{"m":"BAS 04","o":"Criada","p":"O relatório de ocorrência deve ser escrito com opiniões pessoais e adjetivos.","r":false,"b":"Deve ser objetivo, factual, imparcial e baseado apenas em factos verificáveis."},{"m":"BAS 04","o":"Criada","p":"O termo \"ERICA\" refere-se a: Escuta, Reformulação, Informação, Clarificação e Atenção.","r":true,"b":"São os cinco pilares de uma comunicação interpessoal eficaz e empática no exercício das funções."},{"m":"BAS 04","o":"Oficial","p":"O termo ERICA está relacionado com a utilização de materiais e equipamentos.","r":false,"b":"ERICA refere-se a elementos de comunicação eficaz: Escuta, Reformulação, Informação, Clarificação, Atenção."},{"m":"BAS 04","o":"Oficial","p":"O uniforme da Empresa de Segurança Privada só pode ser utilizado quando em serviço ou noutras quaisquer situações que o possam determinar.","r":true,"b":"O uniforme representa a empresa e profissionalismo do vigilante. Uso em contextos apropriados."},{"m":"BAS 04","o":"Oficial","p":"O uso do uniforme é obrigatório e deve ser mantido em bom estado de conservação.","r":true,"b":"O uniforme identifica a função e a entidade patronal, sendo obrigatório por lei."},{"m":"BAS 04","o":"Oficial","p":"O vigilante deve guardar sigilo profissional sobre factos de que tome conhecimento no exercício das funções.","r":true,"b":"O segredo profissional é um dever ético e legal fundamental da profissão."},{"m":"BAS 04","o":"Criada","p":"O vigilante deve informar o seu superior hierárquico sobre qualquer irregularidade detetada.","r":true,"b":"O dever de informação é essencial para a segurança e gestão da operação."},{"m":"BAS 04","o":"Oficial","p":"É permitido ao vigilante aceitar gratificações de clientes para facilitar acessos.","r":false,"b":"Aceitar \"gorjetas\" ou subornos viola os princípios de isenção e integridade."},{"m":"BAS 05","o":"Oficial","p":"A comunicação verbal faz-se por meio de sinais sonoros e visuais.","r":false,"b":"Comunicação verbal utiliza a palavra oral ou escrita. Combinação com sinais é comunicação mista."},{"m":"BAS 05","o":"Criada","p":"A empatia consiste em concordar com tudo o que o utente diz, mesmo que esteja errado.","r":false,"b":"Empatia é compreender o sentimento do outro, não necessariamente concordar com as suas posições."},{"m":"BAS 05","o":"Oficial","p":"A expressão Facial é uma forma de linguagem não verbal.","r":true,"b":"A afirmação é verdadeira porque a expressão facial transmite emoções, atitudes e intenções sem recorrer diretamente às palavras. No estudo da comunicação, integra claramente a linguagem não verbal, tal como os gestos, o olhar e a postura."},{"m":"BAS 05","o":"Criada","p":"A ética profissional permite aceitar gratificações de clientes para facilitar acessos.","r":false,"b":"Viola gravemente os princípios de integridade e isenção profissional. É proibido."},{"m":"BAS 05","o":"Oficial","p":"Falar uma linguagem que não é entendida pelo recetor é uma barreiras à comunicação, mas a resistência à mudança não é uma barreiras à comunicação.","r":false,"b":"A afirmação é falsa porque falar uma linguagem que o recetor não entende constitui claramente uma barreira à comunicação. Além disso, atitudes internas e resistências pessoais também podem dificultar a comunicação eficaz, pelo que a frase está errada no seu conjunto."},{"m":"BAS 05","o":"Criada","p":"Na comunicação, o emissor é quem descodifica a mensagem enviada.","r":false,"b":"O emissor é quem envia a mensagem; o recetor é quem a descodifica."},{"m":"BAS 05","o":"Criada","p":"O preconceito é uma barreira psicológica que impede o tratamento igualitário.","r":true,"b":"Atitudes baseadas em estereótipos prejudicam a qualidade do serviço prestado."},{"m":"BAS 05","o":"Oficial","p":"Os relatórios de atividade diárias, é um relatório de rotinas, utilizado para documentar as atividades e observações dos seguranças ao longo de um dia ou de um turno.","r":true,"b":"A afirmação é verdadeira porque o relatório de atividade diária serve para registar rotinas, observações, ações realizadas e ocorrências verificadas ao longo de um turno ou dia de serviço. A pergunta testa a função prática dos métodos de registo na atividade de segurança privada."},{"m":"BAS 05","o":"Oficial","p":"Referirmo-nos ao termo \"linguagem Cinésica\" é o mesmo que dizer linguagem \"Para linguística\".","r":false,"b":"A afirmação é falsa porque linguagem cinésica e linguagem paralinguística não significam o mesmo. A cinésica relaciona-se com gestos, postura, movimentos e expressão corporal; a paralinguística refere-se a elementos vocais da fala, como tom, ritmo, intensidade e entoação."},{"m":"BAS 05","o":"Oficial","p":"Referirmo-nos ao termo linguagem Cinesica é o mesmo que dizer linguagem Paralingustica.","r":false,"b":"Cinesica refere-se ao movimento do corpo; paralingustica relaciona-se com tom de voz e sons."},{"m":"BAS 05","o":"Criada","p":"Ruídos ambientais são considerados barreiras físicas à comunicação.","r":true,"b":"Interferem na receção clara e precisa da mensagem transmitida."},{"m":"BAS 05","o":"Oficial","p":"Um relatório de ocorrência deve ser redigido de forma subjetiva, incluindo as opiniões do vigilante.","r":false,"b":"O relatório deve ser objetivo, factual e imparcial. Opiniões e juízos de valor não devem constar no documento."},{"m":"BAS 06","o":"Criada","p":"A desescalada de um conflito visa reduzir a tensão através de técnicas de comunicação.","r":true,"b":"\"Baixar o tom\" para evitar a violência física."},{"m":"BAS 06","o":"Criada","p":"A fadiga e o stress não são considerados riscos profissionais na segurança privada.","r":false,"b":"São riscos psicossociais muito comuns devido ao trabalho por turnos e vigilância constante."},{"m":"BAS 06","o":"Oficial","p":"A mediação de conflitos pelo vigilante deve ser feita de forma imparcial e objetiva.","r":true,"b":"Não deves tomar partidos, mas sim resolver o problema de segurança."},{"m":"BAS 06","o":"Criada","p":"A sinalização de cor vermelha indica sempre situações de segurança ou emergência.","r":false,"b":"Vermelho indica proibição, perigo/alarme ou localização de material de combate a incêndio."},{"m":"BAS 06","o":"Oficial","p":"Considera-se acidente de trabalho o ocorrido no trajeto de apenas ida para o local de trabalho nos termos definidos em regulamentação específica.","r":false,"b":"Acidente de trabalho inclui tanto trajeto de ida como de regresso, nos termos da Lei 98/2009."},{"m":"BAS 06","o":"Criada","p":"Em caso de incêndio, o elevador deve ser o meio de evacuação prioritário.","r":false,"b":"Nunca usar elevadores em caso de incêndio. Risco de ficar preso ou falha de corrente."},{"m":"BAS 06","o":"Criada","p":"Ergonomia é o estudo da adaptação do trabalho ao homem.","r":true,"b":"Visa o conforto, saúde e eficiência do trabalhador. Fundamental na prevenção de lesões."},{"m":"BAS 06","o":"Oficial","p":"Na escolha dos EPI´s devem ter-se em conta: os riscos a que o trabalhador está exposto, as condições de trabalho, a parte do corpo que se pretende proteger e as características do próprio trabalhador.","r":true,"b":"A afirmação é verdadeira porque a escolha dos EPI deve atender aos riscos existentes, às condições de trabalho, à parte do corpo a proteger e às características do utilizador. A pergunta testa os critérios base de seleção adequada do equipamento de proteção individual."},{"m":"BAS 06","o":"Oficial","p":"O Cinto Arnês deve ser verificado antes de cada utilização.","r":true,"b":"Equipamentos de segurança em altura exigem inspeção visual constante para evitar falhas."},{"m":"BAS 06","o":"Oficial","p":"O Cinto Arnês é utilizado para proteção dos membros superiores.","r":false,"b":"A afirmação é falsa porque o cinto arnês não se destina à proteção dos membros superiores. Trata-se de um equipamento associado sobretudo à prevenção de quedas e à segurança do corpo em trabalhos em altura."},{"m":"BAS 06","o":"Criada","p":"O empregador deve fornecer os EPIs (coletes, luvas, etc.) sem qualquer custo para o vigilante.","r":true,"b":"É obrigação da empresa dar o equipamento de segurança de graça ao trabalhador."},{"m":"BAS 06","o":"Criada","p":"O extintor de pó químico é adequado para fogos que envolvem eletricidade.","r":true,"b":"O pó químico não conduz eletricidade, sendo seguro para estes casos."},{"m":"BAS 06","o":"Oficial","p":"O pictograma de uma chama sobre fundo laranja indica substância inflamável.","r":true,"b":"Faz parte da sinalização de segurança para produtos químicos."},{"m":"BAS 06","o":"Criada","p":"O risco profissional é a probabilidade de um perigo causar dano durante o trabalho.","r":true,"b":"Conceito fundamental de Higiene e Segurança no Trabalho. Risco = Perigo x Probabilidade."},{"m":"BAS 06","o":"Oficial","p":"O ruído excessivo no local de trabalho pode causar doenças profissionais irreversíveis.","r":true,"b":"A exposição prolongada sem proteção auditiva causa surdez profissional."},{"m":"BAS 06","o":"Oficial","p":"O uso da força física deve ser a primeira opção perante uma intrusão verbal.","r":false,"b":"A força é sempre o último recurso (subsidiário)."},{"m":"BAS 06","o":"Criada","p":"O uso de luvas é obrigatório apenas quando o vigilante sente frio.","r":false,"b":"Luvas são EPIs para protecção contra riscos mecânicos, químicos ou biológicos específicos."},{"m":"BAS 06","o":"Criada","p":"O vigilante deve responder a um insulto com um insulto de igual gravidade para manter a autoridade.","r":false,"b":"O vigilante deve manter o profissionalismo e a calma (controlo emocional)."},{"m":"BAS 06","o":"Oficial","p":"Quando referimos \"situação perigosa\" diz respeito a um acontecimento não planeado que provoque a morte, um dano para a saúde, um ferimento, um prejuízo ou outras perdas.","r":false,"b":"A afirmação é falsa porque essa definição corresponde a acidente ou dano, e não a situação perigosa. No manual, perigo é a propriedade ou condição com potencial para provocar dano; já o acontecimento não planeado com consequências corresponde ao acidente/dano."},{"m":"BAS 06","o":"Criada","p":"Se um vigilante sofrer um acidente a caminho de casa, não é considerado acidente de trabalho.","r":false,"b":"O acidente \"in itinere\" (no percurso casa-trabalho ou vice-versa) é considerado acidente de trabalho pela lei."},{"m":"BAS 06","o":"Oficial","p":"Sinais de perigo têm forma quadrangular, um pictograma a preto sobre fundo amarelo.","r":false,"b":"Sinais de perigo têm forma TRIANGULAR com contorno e pictograma preto sobre fundo amarelo."},{"m":"BAS 06","o":"Oficial","p":"Um acidente de trabalho deve ser comunicado à seguradora no prazo de 24 horas.","r":true,"b":"A comunicação rápida garante a cobertura e o tratamento adequado do sinistro."},{"m":"VIG 01","o":"Criada","p":"A iluminação de segurança deve ser instalada de forma a encandear o vigilante.","r":false,"b":"Deve encandear o intruso e facilitar a visão do vigilante para o exterior."},{"m":"VIG 01","o":"Criada","p":"A segurança eletrónica (alarmes) substitui totalmente a necessidade de segurança física (portas e grades).","r":false,"b":"As duas devem trabalhar juntas. O alarme avisa, mas as portas e grades é que impedem ou atrasam a entrada."},{"m":"VIG 01","o":"Criada","p":"A segurança física é apresentada no manual como a primeira linha de defesa num esquema de segurança.","r":true,"b":"O manual define a segurança física como primeira linha de defesa."},{"m":"VIG 01","o":"Criada","p":"As ameaças externas são mais fáceis de controlar pela empresa do que as ameaças internas.","r":false,"b":"O manual refere que a segurança externa é mais complexa de controlar."},{"m":"VIG 01","o":"Oficial","p":"As barreiras físicas têm como função principal impedir totalmente a intrusão.","r":false,"b":"As barreiras servem para retardar (demorar) a intrusão, dando tempo à resposta."},{"m":"VIG 01","o":"Oficial","p":"As barreiras naturais (ex: um rio) são consideradas elementos de segurança física.","r":true,"b":"Qualquer elemento, natural ou artificial, que dificulte ou atrase o acesso a uma instalação faz parte da segurança física."},{"m":"VIG 01","o":"Oficial","p":"As medidas de segurança passiva são aquelas que detetam a intrusão e emitem um alerta.","r":false,"b":"As medidas passivas são barreiras físicas (muros, grades). As que detetam e alertam são medidas ativas ou eletrónicas."},{"m":"VIG 01","o":"Oficial","p":"As reduções das probabilidades de sucesso do intruso podem ser conseguidas através do aumento de camadas de proteção, da melhoria da respetiva eficácia ou de uma conjugação de ambas.","r":true,"b":"O manual refere este princípio básico da segurança em profundidade."},{"m":"VIG 01","o":"Oficial","p":"As vedações de rede metálica são consideradas barreiras físicas passivas.","r":true,"b":"São elementos fixos que não requerem energia para delimitar o perímetro."},{"m":"VIG 01","o":"Criada","p":"Barreiras físicas servem apenas para impedir a entrada, nunca para atrasar o intruso.","r":false,"b":"Uma das funções principais é Demorar - atrasar a intrusão, não apenas bloquear."},{"m":"VIG 01","o":"Oficial","p":"Em segurança em profundidade, os 4D's são: Dissuadir, Detetar, Demorar e Devolver.","r":false,"b":"A pergunta testa se conheces corretamente os 4D's da segurança em profundidade. No manual, a formulação apresentada é Dissuadir, Detetar, Demorar e Derrotar."},{"m":"VIG 01","o":"Oficial","p":"Na análise de risco, não é necessário considerar as variáveis externas pois são controláveis pela empresa.","r":false,"b":"As variáveis externas (ex: criminalidade local) são obrigatórias e, por definição, não são controláveis pela empresa."},{"m":"VIG 01","o":"Criada","p":"Na avaliação de riscos devem ser consideradas três fases: zona periférica, zona perimetral e zona interna.","r":true,"b":"O manual identifica essas três fases na avaliação de riscos."},{"m":"VIG 01","o":"Criada","p":"Na segurança em profundidade, concentrar toda a resistência numa única linha de proteção é a solução recomendada.","r":false,"b":"O manual diz que a segurança em profundidade usa sucessivas camadas de proteção."},{"m":"VIG 01","o":"Oficial","p":"No âmbito da segurança física, o risco é a probabilidade de uma ameaça explorar uma vulnerabilidade.","r":true,"b":"É a definição técnica: Risco = Ameaça x Vulnerabilidade. Se não houver vulnerabilidade, o risco é zero."},{"m":"VIG 01","o":"Criada","p":"Nos 4D's da segurança em profundidade, o último D corresponde a Derrotar.","r":true,"b":"O manual enumera Dissuadir, Detetar, Demorar e Derrotar."},{"m":"VIG 01","o":"Criada","p":"O Vigilante deve variar o sentido e o itinerário das suas rondas.","r":true,"b":"Se fores sempre pelo mesmo caminho, o intruso consegue prever onde tu vais estar."},{"m":"VIG 01","o":"Oficial","p":"O arame farpado colocado no topo de um muro é um elemento de dissuasão.","r":true,"b":"Além de dificultar a passagem, a sua visão faz o intruso hesitar ou desistir."},{"m":"VIG 01","o":"Criada","p":"O controlo de acessos pode ser manual, semiautomático ou automático.","r":true,"b":"São as três formas de gestão de fluxo de pessoas e veículos em vigilância."},{"m":"VIG 01","o":"Criada","p":"Os 4 Ds da segurança física são: Dissuadir, Detetar, Demorar e Derrotar.","r":true,"b":"Pilares fundamentais da segurança física em profundidade mencionados no manual VIG 01."},{"m":"VIG 01","o":"Oficial","p":"Os círculos concêntricos de segurança visam retardar a progressão de um intruso até ao ativo.","r":true,"b":"É o conceito de segurança em profundidade: várias camadas que o intruso tem de ultrapassar."},{"m":"VIG 01","o":"Oficial","p":"Quando se pretende garantir a segurança física de um espaço, estão definidos 5 graus de risco.","r":false,"b":"Geralmente a análise divide-se em 3 graus (Baixo, Médio, Elevado). Os sistemas de alarme (EN 50131) é que preveem 4 graus."},{"m":"VIG 01","o":"Criada","p":"Quanto menos portes existirem num perímetro, maior tende a ser a segurança.","r":true,"b":"Reduz vulnerabilidades e pontos de entrada. Mais fácil de controlar e monitorizar."},{"m":"VIG 01","o":"Criada","p":"Se não houver rendição, o vigilante deve fechar a porta principal e deixar as chaves na receção.","r":false,"b":"Isso é abandono de posto e negligência de segurança."},{"m":"VIG 01","o":"Criada","p":"Uma \"eclusa\" é um sistema de duas portas onde a segunda só abre se a primeira estiver fechada.","r":true,"b":"É um método comum de controlo de acessos em bancos e áreas de alta segurança."},{"m":"VIG 01","o":"Oficial","p":"Uma barreira passiva é aquela que não necessita de energia para cumprir a sua função.","r":true,"b":"Exemplo: muros, redes e vidros. Estão lá e funcionam sem eletricidade."},{"m":"VIG 01","o":"Criada","p":"Uma área de acesso livre é aquela que exige autorização específica do diretor de segurança.","r":false,"b":"Áreas de acesso livre não têm restrição de entrada. Acesso condicionado exige identificação."},{"m":"VIG 01","o":"Oficial","p":"Vulnerabilidades são fragilidades ou pontos fracos que podem ser explorados pelo agressor.","r":true,"b":"Representam a falha interna (ex: porta aberta) que permite que a ameaça externa se concretize."},{"m":"VIG 02","o":"Criada","p":"A cortesia e a urbanidade são deveres do vigilante no trato com o público.","r":true,"b":"É fundamental para a imagem da segurança e resolução de conflitos."},{"m":"VIG 02","o":"Criada","p":"A gravação de som em sistemas de videovigilância é proibida sem autorização prévia.","r":true,"b":"Restrição legal importante. Gravação de som requer autorização da Comissão de Protecção de Dados."},{"m":"VIG 02","o":"Criada","p":"A linguagem corporal do vigilante (postura) não tem influência na gestão de um conflito.","r":false,"b":"Uma postura agressiva pode \"escalar\" o conflito; uma postura firme mas aberta ajuda a \"desescalar\"."},{"m":"VIG 02","o":"Criada","p":"A responsabilidade do vigilante termina exatamente no minuto em que acaba o seu horário de escala.","r":false,"b":"Termina apenas quando é efetivamente rendido ou autorizado pela hierarquia."},{"m":"VIG 02","o":"Oficial","p":"A ronda deve ser efetuada em períodos de tempo fixos e regulares.","r":false,"b":"Devem ser irregulares para evitar que o intruso preveja os movimentos do vigilante."},{"m":"VIG 02","o":"Criada","p":"A vigilância estática é feita num posto fixo, como uma portaria ou receção.","r":true,"b":"O vigilante permanece num local específico com visibilidade do acesso."},{"m":"VIG 02","o":"Criada","p":"A vigilância móvel pode incluir rondas preventivas com o objetivo de detetar anomalias, intrusões ou falhas de segurança.","r":true,"b":"A pergunta testa o conceito de vigilância móvel: o vigilante circula para observar, prevenir e detetar situações anómalas."},{"m":"VIG 02","o":"Criada","p":"Em caso de falta de rendição, a primeira prioridade é contactar o supervisor ou a central de controlo.","r":true,"b":"Deves reportar imediatamente para que a empresa envie um substituto."},{"m":"VIG 02","o":"Oficial","p":"Na rendição, o vigilante cessante deve transmitir ao colega todas as anomalias detetadas no turno.","r":true,"b":"A continuidade da informação é vital para a segurança da instalação."},{"m":"VIG 02","o":"Criada","p":"Na vigilância móvel, o vigilante não deve seguir itinerários para não se tornar previsível.","r":true,"b":"Variação de rotas e horários aumenta eficácia da ronda. Evita rotinas exploráveis."},{"m":"VIG 02","o":"Criada","p":"No caso de uma evacuação, o vigilante deve ser o primeiro a sair para guiar as pessoas no exterior.","r":false,"b":"O vigilante deve ser dos últimos, garantindo que ninguém fica para trás e orientando o fluxo."},{"m":"VIG 02","o":"Criada","p":"No controlo de acessos, a \"autenticação\" serve para confirmar se a identidade é verdadeira.","r":true,"b":"Identificar é dizer quem é; autenticar é provar (ex: através de cartão ou biometria)."},{"m":"VIG 02","o":"Oficial","p":"No controlo de acessos, a identificação e a autorização são o mesmo conceito.","r":false,"b":"Identificar é saber quem é. Autorizar é verificar se essa pessoa tem permissão para entrar. Podes ser identificado e não estar autorizado."},{"m":"VIG 02","o":"Criada","p":"Num serviço de rondas, o vigilante só deve comunicar com a central quando existir crime consumado.","r":false,"b":"A pergunta avalia a função da comunicação operacional, que também serve para relatar anomalias, avarias, atrasos e outras ocorrências relevantes."},{"m":"VIG 02","o":"Criada","p":"O \"Relatório de Ocorrência\" deve ser entregue apenas no final do mês.","r":false,"b":"Deve ser preenchido e entregue o mais rapidamente possível após o evento."},{"m":"VIG 02","o":"Criada","p":"O bastão de ronda serve apenas para o vigilante se defender de agressões físicas.","r":false,"b":"O bastão de ronda eletrónico é um meio técnico de controlo que prova que o vigilante passou por determinados pontos a certas horas."},{"m":"VIG 02","o":"Oficial","p":"O fardamento do vigilante pode ser alterado com peças de roupa civil por conforto.","r":false,"b":"O uniforme é de uso obrigatório e exclusivo, conforme o modelo aprovado pela PSP."},{"m":"VIG 02","o":"Oficial","p":"O registo de visitantes deve conter a hora de entrada e a hora de saída.","r":true,"b":"É essencial para o controlo de segurança e rastreabilidade em caso de incidente."},{"m":"VIG 02","o":"Criada","p":"O relatório de ocorrência deve ser escrito com opiniões pessoais do vigilante sobre o suspeito.","r":false,"b":"O relatório deve ser estritamente objetivo e factual. Deves escrever o que viste e ouviste, sem julgamentos ou adjetivos pessoais."},{"m":"VIG 02","o":"Criada","p":"O sistema de CCTV substitui totalmente a necessidade de vigilantes humanos.","r":false,"b":"CCTV é ferramenta de apoio à vigilância humana, não substitui discernimento e ação."},{"m":"VIG 02","o":"Oficial","p":"O vigilante deve permanecer no posto até ser rendido, mesmo que isso implique fazer horas extraordinárias.","r":true,"b":"O dever de vigilância e proteção das instalações prevalece."},{"m":"VIG 02","o":"Oficial","p":"O vigilante deve realizar a revista de bens pessoais apenas quando houver suspeita fundada de crime.","r":true,"b":"A revista é intrusiva e deve respeitar a dignidade e os limites da lei 34/2013."},{"m":"VIG 02","o":"Criada","p":"O vigilante pode abandonar o posto se o colega da rendição se atrasar mais de 15 minutos.","r":false,"b":"O posto nunca pode ficar desprotegido. Deve aguardar e informar a Central."},{"m":"VIG 02","o":"Oficial","p":"O vigilante, ao detetar uma intrusão, deve prioritariamente contactar a central ou autoridades.","r":true,"b":"A segurança eletrónica deteta, mas a resposta humana deve ser coordenada e segura."},{"m":"VIG 02","o":"Criada","p":"Um Piquete de Intervenção serve para realizar tarefas de limpeza e manutenção.","r":false,"b":"Serve para responder prontamente a sinais de alarme e situações de segurança."},{"m":"VIG 02","o":"Criada","p":"Um vigilante em posto fixo pode abandonar o local se o turno já tiver terminado, mesmo sem rendição.","r":false,"b":"O vigilante deve aguardar o rendente ou instruções da central para não deixar o posto desprotegido."},{"m":"VIG 02","o":"Criada","p":"É permitido ao vigilante pedir a um funcionário do cliente para \"dar uma olhadela\" no posto enquanto vai embora.","r":false,"b":"Só pessoal de segurança privada habilitado pode exercer funções de vigilância."},{"m":"VIG 03","o":"Criada","p":"A primeira ação ao detetar um incêndio é dar o alerta e garantir a evacuação das pessoas.","r":true,"b":"O alerta e a evacuação são as ações prioritárias para salvar vidas."},{"m":"VIG 03","o":"Criada","p":"A sinalização de emergência (saídas) deve ser fotoluminescente para ser vista no escuro.","r":true,"b":"Deve brilhar no escuro para orientar a evacuação em caso de falha de luz."},{"m":"VIG 03","o":"Criada","p":"Ao detetar um incêndio, a primeira prioridade do vigilante é salvar os bens materiais valiosos.","r":false,"b":"A prioridade máxima é sempre a vida humana e a evacuação segura das pessoas."},{"m":"VIG 03","o":"Oficial","p":"Em caso de incêndio num quadro elétrico sob tensão, o extintor de CO2 é uma escolha adequada.","r":true,"b":"O CO2 não conduz eletricidade e não danifica os componentes."},{"m":"VIG 03","o":"Oficial","p":"Em caso de incêndio, uma porta corta-fogo deve ser mantida aberta com um calço para facilitar a evacuação.","r":false,"b":"As portas corta-fogo devem estar sempre fechadas (ou fechar sozinhas) para impedir a propagação do fumo e das chamas."},{"m":"VIG 03","o":"Criada","p":"Em caso de inundação, o vigilante deve primeiro tentar salvar documentos e só depois fechar a água.","r":false,"b":"Prioridade é estancar a causa - fechar torneiras/válvulas e dar o alerta."},{"m":"VIG 03","o":"Oficial","p":"No Plano de Emergência, a salvaguarda de vidas humanas precede a proteção de bens materiais.","r":true,"b":"Vidas primeiro, bens depois. É a regra de ouro da segurança contra incêndios."},{"m":"VIG 03","o":"Criada","p":"No caso de fumo denso, deve-se caminhar o mais próximo possível do chão.","r":true,"b":"O ar junto ao chão está mais limpo e fresco, facilitando a respiração e visibilidade."},{"m":"VIG 03","o":"Criada","p":"No regime de rendição de postos, o vigilante deve chegar idealmente 15 minutos antes do início do turno.","r":true,"b":"Este tempo permite a passagem de informações relevantes (briefing) e a verificação do estado do posto e equipamentos."},{"m":"VIG 03","o":"Criada","p":"Num fogo de Classe F (óleos de cozinha), deve-se usar água para apagar rapidamente as chamas.","r":false,"b":"Água em óleo a ferver causa uma explosão de vapor (boil-over)."},{"m":"VIG 03","o":"Criada","p":"O Ponto de Encontro é o local onde todos se devem reunir após a evacuação do edifício.","r":true,"b":"Serve para fazer a contagem das pessoas e garantir que ninguém ficou lá dentro."},{"m":"VIG 03","o":"Criada","p":"O dever de colaboração com as autoridades significa que o vigilante pode substituir-se à polícia.","r":false,"b":"A pergunta testa a distinção entre colaborar com a autoridade e exercer competências que pertencem exclusivamente às forças de segurança."},{"m":"VIG 03","o":"Criada","p":"O extintor de CO2 (Dióxido de Carbono) atua principalmente por abafamento e arrefecimento.","r":true,"b":"Ele retira o oxigénio e sai a uma temperatura muito baixa."},{"m":"VIG 03","o":"Criada","p":"O extintor de pó químico ABC é considerado um extintor polivalente.","r":true,"b":"É eficaz em fogos de sólidos (A), líquidos (B) e gases (C)."},{"m":"VIG 03","o":"Oficial","p":"O extintor de água pode ser utilizado em fogos de classe B (líquidos inflamáveis).","r":false,"b":"A água espalha os líquidos a arder, agravando o incêndio."},{"m":"VIG 03","o":"Criada","p":"O livro de sumário serve para registar apenas os nomes dos visitantes.","r":false,"b":"Serve para registar todas as ocorrências relevantes e eventos do turno."},{"m":"VIG 03","o":"Oficial","p":"O método de extinção por \"abafamento\" consiste em retirar o comburente (oxigénio).","r":true,"b":"Ao cobrir o fogo, retira-se o oxigénio e a combustão para."},{"m":"VIG 03","o":"Criada","p":"O pessoal de vigilância deve exibir prontamente o cartão profissional quando tal lhe seja solicitado no exercício das suas funções.","r":true,"b":"A pergunta avalia o dever de identificação profissional do pessoal de vigilância."},{"m":"VIG 03","o":"Criada","p":"O pessoal de vigilância deve prestar assistência a pessoas em perigo sempre que a situação o exija.","r":true,"b":"A pergunta avalia uma das regras de conduta do pessoal de vigilância no exercício da profissão."},{"m":"VIG 03","o":"Oficial","p":"O triângulo do fogo é composto por: Combustível, Comburente e Calor.","r":true,"b":"São os três elementos necessários para haver fogo. Se retirares um, o fogo apaga-se."},{"m":"VIG 03","o":"Criada","p":"O vigilante deve abandonar o posto mal termine o seu horário, mesmo sem rendição.","r":false,"b":"É proibido abandonar o posto sem autorização ou chegada do colega de rendição."},{"m":"VIG 03","o":"Criada","p":"O vigilante deve conhecer o plano de emergência do local onde presta serviço.","r":true,"b":"É essencial para saber como agir em caso de fogo, sismo ou catástrofe."},{"m":"VIG 03","o":"Criada","p":"O vigilante só deve tentar combater o incêndio se a sua segurança pessoal estiver garantida.","r":true,"b":"O combate inicial (extintores) só se faz se houver condições de segurança para o vigilante."},{"m":"VIG 03","o":"Criada","p":"Os fogos de Classe A são aqueles que resultam da combustão de sólidos que deixam brasas.","r":true,"b":"Exemplos: madeira, papel, tecidos e cartão."},{"m":"VIG 03","o":"Oficial","p":"Os fogos de Classe A são fogos que envolvem metais combustíveis como o magnésio.","r":false,"b":"Classe A são sólidos (madeira, papel). Metais são Classe D."},{"m":"VIG 03","o":"Criada","p":"Perante um incêndio incontrolável, o vigilante deve arriscar a sua vida para recuperar o cofre da empresa.","r":false,"b":"Nunca se deve colocar a integridade física em risco por bens materiais."},{"m":"VIG 03","o":"Criada","p":"Se houver pessoas presas num edifício em chamas, o vigilante deve priorizar o fecho de todas as portas de segurança.","r":false,"b":"Embora o isolamento ajude, o foco principal de qualquer procedimento é a retirada das pessoas."},{"m":"VIG 03","o":"Criada","p":"Se utilizar um extintor de água num equipamento elétrico ligado, corre risco de eletrocussão.","r":true,"b":"A água é condutora de eletricidade. Nunca usar em eletricidade."},{"m":"VIG 03","o":"Criada","p":"Um extintor de Água é o mais indicado para fogos em quadros elétricos ligados.","r":false,"b":"A água conduz eletricidade. Deve usar-se CO2 ou Pó Químico."},{"m":"VIG 03","o":"Criada","p":"Verificar portas e janelas é uma tarefa fundamental durante as rondas de fecho.","r":true,"b":"Garante que o perímetro está selado contra intrusões antes do encerramento."},{"m":"VIG 04","o":"Criada","p":"A entidade autorizada a realizar revistas deve afixar a autorização em local visível junto do controlo de acesso.","r":true,"b":"Essa obrigação é indicada no artigo 19.º, n.º 7, citado no manual."},{"m":"VIG 04","o":"Criada","p":"A realização de revistas sem autorização ou em violação das condições legais pode constituir contraordenação muito grave.","r":true,"b":"O manual apresenta este regime sancionatório no artigo 59.º."},{"m":"VIG 04","o":"Criada","p":"A recusa em submeter-se a uma revista legalmente autorizada pode impedir a entrada no local controlado.","r":true,"b":"O artigo 19.º referido no manual prevê que a recusa pode determinar a impossibilidade de entrada."},{"m":"VIG 04","o":"Criada","p":"A revista de prevenção visa detetar armas ou objetos que ponham em risco a segurança.","r":true,"b":"Objetivo principal deste procedimento de protecção preventiva."},{"m":"VIG 04","o":"Criada","p":"A revista por palpação apenas pode ser realizada por pessoal de vigilância do mesmo sexo da pessoa controlada.","r":true,"b":"Esta condição é indicada expressamente no regime legal apresentado no módulo VIG04."},{"m":"VIG 04","o":"Criada","p":"As revistas como meio de obtenção de prova estão vedadas à segurança privada.","r":true,"b":"O manual distingue claramente as revistas judiciárias das revistas de prevenção e segurança e conclui que a obtenção de prova está vedada à segurança privada."},{"m":"VIG 04","o":"Criada","p":"As revistas de prevenção e segurança destinam-se à obtenção de prova criminal.","r":false,"b":"A pergunta reforça, por formulação diferente, que a finalidade da revista de prevenção é preventiva e não probatória."},{"m":"VIG 04","o":"Criada","p":"As revistas intrusivas por palpação exigem supervisão das forças de segurança territorialmente competentes.","r":true,"b":"O módulo legal indica que a palpação e vistorias de bens transportados dependem dessa supervisão."},{"m":"VIG 04","o":"Criada","p":"As revistas pessoais de prevenção e segurança podem ser feitas em qualquer local público por iniciativa do vigilante.","r":false,"b":"Só podem ocorrer nas condições legais e nos locais autorizados, como acesso vedado ou condicionado com medidas reforçadas."},{"m":"VIG 04","o":"Criada","p":"As revistas por equipamentos não intrusivos podem incluir raquetes de deteção de metais ou explosivos previamente autorizadas.","r":true,"b":"O manual menciona estes meios como permitidos para revistas não intrusivas."},{"m":"VIG 04","o":"Criada","p":"O vigilante deve solicitar o consentimento da pessoa antes de iniciar uma revista de prevenção.","r":true,"b":"Procedimento obrigatório para respeitar direitos do cidadão e cumprir lei."},{"m":"VIG 04","o":"Criada","p":"O vigilante pode confiscar objetos pessoais permanentemente durante uma revista.","r":false,"b":"A pergunta testa os limites legais da revista de prevenção. O vigilante não pode apropriar-se de objetos nem decidir o seu destino final."},{"m":"VIG 04","o":"Criada","p":"O vigilante pode retirar ele próprio objetos da mala do visado durante a revista se achar necessário.","r":false,"b":"O procedimento deve respeitar os limites legais e o manual alerta para a natureza restrita desta intervenção."},{"m":"VIG 04","o":"Criada","p":"Os assistentes de portos e aeroportos podem efetuar revistas de prevenção e segurança no controlo de acesso a zonas restritas de segurança.","r":true,"b":"O manual refere esta possibilidade no artigo 19.º da Lei n.º 46/2019."},{"m":"VIG 04","o":"Criada","p":"Revistas pessoais de prevenção podem ser feitas por vigilantes de qualquer sexo em qualquer pessoa.","r":false,"b":"A revista por palpação deve ser realizada por pessoal do mesmo sexo da pessoa revista."},{"m":"VIG 04","o":"Criada","p":"Se um cliente recusar a revista obrigatória à entrada, o vigilante pode impedi-lo de entrar.","r":true,"b":"Acesso fica condicionado ao cumprimento das regras de segurança estabelecidas."},{"m":"VIG 05","o":"Criada","p":"A agressividade do vigilante tende a agravar o conflito em vez de o resolver.","r":true,"b":"O módulo VIG05 centra-se em controlo emocional, comunicação adequada e gestão da escalada."},{"m":"VIG 05","o":"Criada","p":"A comunicação calma, firme e objetiva ajuda a reduzir a escalada de um conflito.","r":true,"b":"A gestão de conflitos no manual assenta precisamente em postura calma e comunicação adequada."},{"m":"VIG 05","o":"Criada","p":"A detenção por um vigilante deve ser seguida de rápida articulação com as forças de segurança.","r":true,"b":"O manual sublinha os limites legais apertados e a necessidade de articulação célere com as autoridades."},{"m":"VIG 05","o":"Criada","p":"A empatia na comunicação significa que o vigilante deve concordar com as reclamações do interlocutor para evitar violência.","r":false,"b":"Manual VIG05, pág. 18. Empatia é compreender o sentimento do outro, não é obrigatoriamente concordar."},{"m":"VIG 05","o":"Criada","p":"A escuta ativa implica interromper o interlocutor sempre que ele disser algo factualmente errado.","r":false,"b":"Escuta ativa requer ouvir sem interromper para compreender a mensagem total."},{"m":"VIG 05","o":"Criada","p":"A gestão de conflitos deve privilegiar sempre o diálogo antes do recurso à força.","r":true,"b":"O uso da força é apresentado como último recurso, depois da tentativa de desescalada."},{"m":"VIG 05","o":"Criada","p":"A linguagem paralinguística (tom de voz e ritmo) é mais importante na desescalada do que o conteúdo das palavras.","r":true,"b":"O \"como se diz\" tem mais impacto emocional do que \"o que se diz\"."},{"m":"VIG 05","o":"Criada","p":"A postura do vigilante durante um conflito deve transmitir controlo sem humilhar a outra pessoa.","r":true,"b":"A gestão eficaz exige firmeza e respeito, evitando provocar mais hostilidade."},{"m":"VIG 05","o":"Criada","p":"A proxémica refere-se à distância física que o vigilante deve manter, sendo a \"distância social\" (1,2m a 3,5m) a mais adequada para o atendimento.","r":true,"b":"Manual VIG05, pág. 11. Evita a invasão do espaço pessoal e garante segurança."},{"m":"VIG 05","o":"Criada","p":"Em caso de conflito, o vigilante deve adotar uma postura de \"barreira\", cruzando os braços para demonstrar autoridade.","r":false,"b":"Manual VIG05, pág. 10. Braços cruzados são linguagem não-verbal defensiva/fechada, o que escala o conflito."},{"m":"VIG 05","o":"Oficial","p":"Em caso de flagrante delito, as entidades que têm legitimidade para proceder à detenção são qualquer autoridade judiciária ou entidade policial e qualquer pessoa, se as autoridades não estiverem presentes e não seja possível chamá-las em tempo útil.","r":true,"b":"Corresponde ao enunciado do teste de consolidação enviado pelo utilizador."},{"m":"VIG 05","o":"Criada","p":"Em gestão de conflito, a desescalada através do diálogo é o primeiro recurso do vigilante.","r":true,"b":"Força é último recurso. Comunicação firme e calma reduz riscos de confronto."},{"m":"VIG 05","o":"Criada","p":"Mesmo perante provocação verbal, o vigilante deve manter linguagem correta e postura profissional.","r":true,"b":"Isto enquadra-se nos princípios de desescalada e controlo comportamental tratados no módulo."},{"m":"VIG 05","o":"Criada","p":"Na gestão de conflitos, a \"visão interacionista\" defende que o conflito é necessário para o desempenho eficaz de um grupo.","r":true,"b":"Manual VIG05, pág. 4. O conflito pode estimular a mudança e criatividade."},{"m":"VIG 05","o":"Oficial","p":"Na gestão dos conflitos podemos considerar que um conflito tem sempre efeito negativo ou destrutivo.","r":false,"b":"O manual indica que o conflito não tem sempre conotação negativa; pode ter efeitos positivos ou negativos."},{"m":"VIG 05","o":"Criada","p":"No conflito latente, as partes já manifestam claramente o seu comportamento hostil.","r":false,"b":"No estágio latente o conflito ainda não é declarado."},{"m":"VIG 05","o":"Oficial","p":"Não existe flagrante delito quando o infrator é surpreendido no local da infração, quando a acabou de cometer, ou é perseguido e capturado havendo fortes indícios de que a praticou ou nela participou.","r":false,"b":"A afirmação é falsa porque essas situações correspondem precisamente a flagrante delito."},{"m":"VIG 05","o":"Criada","p":"O autocontrolo emocional do vigilante é importante na gestão de conflitos.","r":true,"b":"Sem controlo emocional, o conflito tende a agravar-se e a resposta deixa de ser profissional."},{"m":"VIG 05","o":"Criada","p":"O conflito deve ser entendido como algo de natureza neutra, podendo ter efeitos positivos ou negativos.","r":true,"b":"O resultado depende da forma como o vigilante gere a situação."},{"m":"VIG 05","o":"Criada","p":"O manual apresenta o conflito como um fenómeno normal e natural, que pode ser gerido de forma construtiva.","r":true,"b":"O manual refere que o conflito pode ser resolvido e até gerar resultados criativos."},{"m":"VIG 05","o":"Criada","p":"O objetivo da gestão de conflitos é restaurar a normalidade com o menor risco possível.","r":true,"b":"A intervenção deve proteger pessoas e bens, reduzindo danos e tensão."},{"m":"VIG 05","o":"Criada","p":"O uso da força é o primeiro recurso recomendado em conflitos intensos.","r":false,"b":"O manual privilegia comunicação e contenção proporcional, não reação imediata pela força."},{"m":"VIG 05","o":"Criada","p":"O vigilante deve confundir firmeza com violência para impor autoridade.","r":false,"b":"A autoridade profissional assenta em postura, legalidade e comunicação, não em violência."},{"m":"VIG 05","o":"Criada","p":"O vigilante deve manter uma distância de segurança (proxémica) para evitar a invasão do espaço pessoal e prevenir agressões.","r":true,"b":"A gestão do espaço é uma técnica de autoproteção e desescalada."},{"m":"VIG 05","o":"Criada","p":"O vigilante pode deter um indivíduo suspeito de furto mesmo que não o tenha visto cometer o crime (flagrante).","r":false,"b":"Lei n.º 46/2019. A detenção por cidadão (vigilante) só é permitida em flagrante delito."},{"m":"VIG 05","o":"Criada","p":"O vigilante pode provocar fisicamente um suspeito para obter confissão mais rápida.","r":false,"b":"Tal atuação contraria a legalidade, a deontologia e os limites funcionais do vigilante."},{"m":"VIG 05","o":"Criada","p":"O vigilante pode reter uma pessoa indefinidamente se suspeitar de roubo.","r":false,"b":"O vigilante não exerce poder de autoridade policial. Em situação legalmente admissível, pode reter alguém em flagrante delito até à chegada da autoridade, com necessidade, proporcionalidade e imediata comunicação às forças de segurança."},{"m":"VIG 05","o":"Criada","p":"Os conflitos podem atingir quatro estágios: latente, percebido, sentido e manifestado.","r":true,"b":"O manual VIG05 enumera esses quatro estágios."},{"m":"VIG 05","o":"Criada","p":"Os efeitos dos conflitos podem ser positivos ou negativos, dependendo também da forma como são tratados.","r":true,"b":"O manual refere efeitos positivos e negativos dos conflitos."},{"m":"VIG 05","o":"Criada","p":"Os procedimentos de detenção do vigilante têm limites legais apertados.","r":true,"b":"Essa ideia é expressamente destacada no resumo do módulo VIG05 no manual."},{"m":"VIG 05","o":"Oficial","p":"Para podermos considerar uma detenção em casos de flagrante delito, o crime em questão tem que se enquadrar em crimes públicos e crimes particulares.","r":false,"b":"A detenção em flagrante delito não depende dessa formulação; a afirmação é apresentada como falsa no teste enviado."},{"m":"VIG 05","o":"Criada","p":"Perante um conflito, o uso da força física deve ser sempre a primeira opção para demonstrar autoridade.","r":false,"b":"A força é o último recurso, privilegiando-se sempre o diálogo."},{"m":"VIG 05","o":"Criada","p":"Segundo a visão interacionista, todo o conflito deve ser eliminado porque prejudica sempre o grupo.","r":false,"b":"O manual reconhece utilidade a certo grau de conflito para a vitalidade do grupo."},{"m":"VIG 05","o":"Oficial","p":"Um vigilante no exercício das suas funções pode efetuar uma detenção fora de flagrante delito.","r":false,"b":"A formulação do teste enviado indica que a resposta correta é falso."},{"m":"VIG 05","o":"Criada","p":"Uma intervenção bem gerida reduz o risco para o próprio vigilante, para terceiros e para o suspeito.","r":true,"b":"A lógica da gestão de conflitos é precisamente reduzir risco e controlar a situação."},{"m":"VIG 06","o":"Oficial","p":"A DNPSP é a autoridade competente pela fiscalização da existência e atualização dos registos de segurança contra incêndio.","r":false,"b":"A autoridade competente para SCIE/Incêndios é a ANEPC."},{"m":"VIG 06","o":"Criada","p":"A clareza e a objetividade são qualidades essenciais num relatório de ocorrência.","r":true,"b":"O manual coloca os registos técnicos e relatórios no centro da prática profissional."},{"m":"VIG 06","o":"Criada","p":"A escrita de um relatório deve ser simples, direta e verificável.","r":true,"b":"São características compatíveis com a exigência de rigor técnico do módulo."},{"m":"VIG 06","o":"Oficial","p":"A existência e a atualização dos registos técnicos deve ser garantida pelo responsável de segurança (RS).","r":true,"b":"É uma responsabilidade legal do titular do cargo de RS."},{"m":"VIG 06","o":"Criada","p":"A identificação correta dos envolvidos é importante nos registos técnicos.","r":true,"b":"Nomes, funções e outros elementos ajudam a validar a ocorrência."},{"m":"VIG 06","o":"Criada","p":"A omissão de horários, locais ou intervenientes reduz a utilidade do relatório.","r":true,"b":"Sem esses elementos, o relatório perde valor técnico e probatório."},{"m":"VIG 06","o":"Oficial","p":"A realização de simulacros pode ter data ou hora não rigorosamente estabelecida para aumentar o realismo do exercício.","r":true,"b":"Serve para testar a reação real dos ocupantes e equipas."},{"m":"VIG 06","o":"Oficial","p":"A realização dos simulacros deve ser sempre comunicada com a devida antecedência aos ocupantes do edifício, podendo não ser rigorosamente estabelecida a data e ou hora programadas.","r":true,"b":"O manual VIG06 refere expressamente esta regra."},{"m":"VIG 06","o":"Oficial","p":"A responsabilidade pela elaboração e execução das Medidas de Autoproteção cabe exclusivamente à empresa de segurança privada.","r":false,"b":"A responsabilidade é do proprietário ou do Responsável de Segurança do edifício."},{"m":"VIG 06","o":"Criada","p":"A simulação prática de incidentes ajuda a preparar a resposta operacional real.","r":true,"b":"O próprio título do módulo inclui simulação prática de incidentes, mostrando a importância do treino."},{"m":"VIG 06","o":"Criada","p":"As Utilizações-Tipo (UT) de \"Hospitalares e Lares de Idosos\" pertencem à UT VI.","r":false,"b":"UT VI são Espetáculos e Reuniões Públicas. Hospitalares e Lares são UT V."},{"m":"VIG 06","o":"Criada","p":"As medidas de autoproteção incluem apenas formação e simulacros.","r":false,"b":"O manual inclui também medidas preventivas, medidas de intervenção e registo de segurança."},{"m":"VIG 06","o":"Criada","p":"As opiniões pessoais do vigilante devem substituir os factos quando não há testemunhas.","r":false,"b":"Os relatórios devem assentar em factos observados e descritos com rigor."},{"m":"VIG 06","o":"Criada","p":"Mesmo pequenas anomalias podem justificar registo, consoante as normas do serviço.","r":true,"b":"Os registos técnicos servem também para acompanhar anomalias e padrões."},{"m":"VIG 06","o":"Oficial","p":"Na ausência do Responsável de Segurança, o seu substituto legal assume todas as obrigações relativas à manutenção dos registos técnicos.","r":true,"b":"Manual VIG06, pág. 45. A segurança deve ser garantida em permanência."},{"m":"VIG 06","o":"Oficial","p":"Na categorização dos edifícios por utilizações-tipo (UT), o regulamento prevê a existência de 21 UT.","r":false,"b":"O regime jurídico de SCIE define apenas 12 Utilizações-tipo."},{"m":"VIG 06","o":"Oficial","p":"O Registo de Segurança deve conter a relação de todas as ações de manutenção e ocorrências relacionadas com a Segurança Contra Incêndio (SCIE).","r":true,"b":"Este registo funciona como o 'diário de bordo' obrigatório do edifício. Serve para provar a entidades externas (como a ANPC ou seguradoras) que todos os equipamentos, como extintores e detetores, foram testados e estão operacionais. Sem este documento preenchido, não há prova legal de que a segurança contra incêndio está a ser cumprida."},{"m":"VIG 06","o":"Criada","p":"O vigilante deve escrever relatórios de forma vaga para evitar responsabilidade.","r":false,"b":"A vagueza prejudica a utilidade do documento e contraria a prática correta."},{"m":"VIG 06","o":"Criada","p":"Os incidentes relevantes devem ser documentados de forma rigorosa.","r":true,"b":"O rigor na documentação é a maior proteção do vigilante. Um relatório detalhado (o quê, quem, quando, onde e como) serve como prova factual em caso de inquérito ou processo judicial. Documentar de forma vaga ou incompleta retira o valor legal ao registo e dificulta a intervenção das autoridades ou da gestão da segurança."},{"m":"VIG 06","o":"Criada","p":"Os registos de segurança devem mencionar ocorrências com data de início e fim e o responsável pelo acompanhamento.","r":true,"b":"O manual refere expressamente esses elementos."},{"m":"VIG 06","o":"Criada","p":"Os registos de segurança devem ser arquivados por 10 anos, podendo existir em papel ou formato digital.","r":true,"b":"O manual indica período de arquivo de 10 anos em papel ou digital."},{"m":"VIG 06","o":"Criada","p":"Os registos de segurança incluem relatórios de vistoria ou inspeção e a relação de ações de manutenção e ocorrências relacionadas com a SCIE.","r":true,"b":"O módulo VIG06 define os registos de segurança nesses termos."},{"m":"VIG 06","o":"Oficial","p":"Os registos técnicos contêm o histórico de segurança e fazem parte das medidas de autoproteção obrig
